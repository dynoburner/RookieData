<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYNASTY DATA JOURNAL // 199X RETRO EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <header class="retro-header">
            <div class="marquee-container">
                <p class="marquee">*** WELCOME TO THE DYNASTY DATA JOURNAL v9.42 *** ALL-TIME PROSPECTS & BIG BOARDS ONLINE ***</p>
            </div>
            <div class="header-main">
                <h1 class="glitch-title">DYNASTY // <span>DATA JOURNAL</span></h1>
                <p class="subtitle">[ SCORES • ROOKIE COMPARISONS • YR 1-3 PPG PROJECTIONS ]</p>
            </div>
            <nav class="nav-tabs">
                <button class="tab-btn active" data-tab="alltime">All-Time Prospects</button>
                <button class="tab-btn" data-tab="bigboard2025">2025 Big Board</button>
                <button class="tab-btn" data-tab="bigboard2026">2026 Big Board</button>
            </nav>
        </header>

        <main class="retro-panel">
            <div class="control-bar">
                <div class="search-box">
                    <label for="searchInput">SEARCH:</label>
                    <input type="text" id="searchInput" placeholder="Search player...">
                </div>
                <div class="filter-group">
                    <label for="posFilter">POS:</label>
                    <select id="posFilter">
                        <option value="ALL">ALL</option>
                        <option value="QB">QB</option>
                        <option value="RB">RB</option>
                        <option value="WR">WR</option>
                        <option value="TE">TE</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table id="dynastyTable">
                    <thead><tr id="tableHeaders"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="retro-footer-stats">
                <div class="stat-box"><span class="stat-label">TOTAL:</span><span class="stat-value" id="statTotal">--</span></div>
                <div class="stat-box"><span class="stat-label">AVG YR 3 PPG:</span><span class="stat-value" id="statPpg">--</span></div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
